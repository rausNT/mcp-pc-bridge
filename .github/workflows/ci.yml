name: Test and build (no automatic publication)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - run: python tools/check_public_tree.py
      - run: python -m unittest discover -s tests -v
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: server/stage1
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: windows/client
      - run: python tools/check_dependencies.py --installed
      - run: npm audit --audit-level=low
        working-directory: server/stage1
      - run: npm audit --audit-level=low
        working-directory: windows/client
      - run: npm test
        working-directory: windows/client
      - run: npm test
        working-directory: server/stage1
      - run: node --test server/stage2/tests/*.test.mjs
      - run: python server/stage2/tests/test_certs.py
      - run: bash -n server/install.sh
  disposable-server:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fresh installer and real scoped SSH acceptance
        run: sudo env GITHUB_ACTIONS=true python3 tests/ci_server_acceptance.py
  windows-tests-and-build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: '1.27.2'
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.204'
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.21.0'
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: windows/client
      - run: npm test
        working-directory: windows/client
      - run: python -m unittest discover -s tests -v
      - run: go test -v ./...
        working-directory: windows/client
      - run: python tools/build_release.py
      - run: dotnet run --project windows/gui-tests/PcBridge.GuiTests.csproj -c Release
      - run: python tools/verify_release.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mcp-pc-bridge-preview-candidate
          path: dist/*
